services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: socraticmath-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TEXT_MODEL
        value: openai/gpt-oss-120b
      - key: VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: socratic_tutor
      - key: GROQ_API_KEY
        sync: false
      - key: MAX_HINT_LIMIT
        value: "6"

  # 2. React Vite Frontend Static Site
  - type: web
    name: socraticmath-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
